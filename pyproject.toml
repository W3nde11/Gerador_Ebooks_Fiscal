[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebook-fiscal"
version = "0.1.0"
description = "Gerador de e-books de rotinas fiscais por empresa a partir de planilhas Excel."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.scripts]
gerar-ebooks-fiscais = "ebook_fiscal.cli:main"
gerador-ebook-fiscal-app = "ebook_fiscal.app:main"

[tool.setuptools]
packages = ["ebook_fiscal"]

[tool.setuptools.package-data]
ebook_fiscal = ["templates/*.docx"]
